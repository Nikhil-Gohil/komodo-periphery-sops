name: Build and Push Komodo Agent

on:
  push:
    branches: [ "main" ]
    # Keep this if you still want the option to manually trigger builds via git tags
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Extract the version directly from Dockerfile
      # Ensures tag always matches what is defined in code.
      - name: Extract App Version
        id: version
        run: |
          # Finds the line "ARG KOMODO_VERSION=x.x.x", splits by "=", and keeps the number
          VERSION=$(grep "ARG KOMODO_VERSION=" Dockerfile | cut -d= -f2)
          echo "KOMODO_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Komodo Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. Always tag 'latest' on main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # 2. Always tag with the specific version from Dockerfile (e.g. v1.19.5)
            # This updates the existing tag if the version # hasn't changed, or creates a new one if it has.
            type=raw,value=v${{ steps.version.outputs.KOMODO_VERSION }},enable={{is_default_branch}}
            # 3. (Optional) Keep support for manual git tags
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
